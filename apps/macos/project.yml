# Amaran Compagnon (docs/superpowers/specs/2026-10-05-pont-amaran-app-compagnon-design.md) :
# copie adaptee de Halo Compagnon. Ce fichier fait foi : le projet Xcode est genere
# (xcodegen generate) et n'est pas versionne.
name: AmaranCompagnon
options:
  bundleIdPrefix: fr.djoko.amaran
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Signature.xcconfig
  Release: Signature.xcconfig
# Sparkle 2 : les mises a jour de l'app, a une version figee (gestionnaire de paquets Swift), comme Halo Compagnon.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Textes : catalogues Localizable.xcstrings (francais, langue de developpement, et anglais),
    # cles extraites par le compilateur.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
targets:
  AmaranProtocole:
    type: framework
    platform: macOS
    sources:
      - path: AmaranProtocole
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.amaran.protocole
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
  AmaranCompagnon:
    type: application
    platform: macOS
    sources:
      - path: AmaranCompagnon
    dependencies:
      - target: AmaranProtocole
      - package: Sparkle
    # Les cles que la generation de l'Info.plist par Xcode ne connait pas : ce fichier, genere par XcodeGen, est
    # complete par celles de INFOPLIST_KEY_ (GENERATE_INFOPLIST_FILE).
    info:
      path: AmaranCompagnon/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Mises a jour (Sparkle 2) : le flux des versions publiees et la cle publique Ed25519 (reglages ci-dessous) ;
        # recherche au demarrage puis toutes les 24 h, telechargement et installation automatiques ; installation
        # par le service de Sparkle, l'app restant dans le bac a sable.
        SUFeedURL: $(FLUX_MISES_A_JOUR)
        SUPublicEDKey: $(CLE_MISES_A_JOUR)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: true
        SUEnableInstallerLauncherService: true
    settings:
      base:
        PRODUCT_NAME: Amaran Compagnon
        PRODUCT_MODULE_NAME: AmaranCompagnon
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.amaran.compagnon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Amaran Compagnon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Amaran Compagnon parle au pont amaran par le réseau Thread de la maison (UDP, par les routeurs de bordure)."
        # La version publiee (Outils/publier.sh) ; le numero de compilation, que compare Sparkle, est donne a la
        # publication : le nombre de commits de main. 1 : une compilation de travail, qui ne cherche jamais.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Le flux des mises a jour (apps/macos/appcast.xml du depot, que publier.sh tient a jour, a son adresse brute)
        # et la cle publique, commune aux apps de Djoko ; la repetition les remplace en ligne de commande.
        FLUX_MISES_A_JOUR: https://raw.githubusercontent.com/Djoko-cli/amaran-matter-thread/main/apps/macos/appcast.xml
        CLE_MISES_A_JOUR: nRIVHOXbEktqGduJ4ukxhjZzlUaiE/yqR3sgbW9Ie6E=
        CODE_SIGN_ENTITLEMENTS: AmaranCompagnon/AmaranCompagnon.entitlements
        # ASSETCATALOG_COMPILER_APPICON_NAME : dans Signature.xcconfig, pour que
        # Local.xcconfig puisse choisir une autre icone (AppIconA2, en repli).
  AmaranProtocoleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AmaranProtocoleTests
    dependencies:
      - target: AmaranProtocole
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.amaran.protocole.tests
        GENERATE_INFOPLIST_FILE: YES
  AmaranCompagnonTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AmaranCompagnonTests
    dependencies:
      - target: AmaranCompagnon
      - target: AmaranProtocole
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.amaran.compagnon.tests
        GENERATE_INFOPLIST_FILE: YES
        # Le produit s'appelle "Amaran Compagnon" (avec une espace), pas comme la cible.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Amaran Compagnon.app/Contents/MacOS/Amaran Compagnon"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  AmaranCompagnon:
    build:
      targets:
        AmaranCompagnon: all
        AmaranProtocole: all
        AmaranProtocoleTests: [test]
        AmaranCompagnonTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AmaranProtocoleTests
        - AmaranCompagnonTests
    archive:
      config: Release
